<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>순창담 본점 출퇴근</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{ --brand:#F26522; --ink:#20242E; --line:#E9ECEF; --sub:#868E96;
       --green:#2F9E44; --red:#E03131; --blue:#1971C2; }
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
body{font-family:Pretendard,-apple-system,sans-serif; background:#F8F9FA; color:var(--ink);
  font-size:17px; line-height:1.6; word-break:keep-all; padding:0 0 40px; max-width:480px; margin:0 auto}
.hidden{display:none !important}
.sub{color:var(--sub); font-size:14.5px}
.wrap{padding:0 18px}
.hero{padding:30px 18px 26px; text-align:center; color:#fff}
.hero.in{background:linear-gradient(160deg,#2F9E44,#207F35)}
.hero.out{background:linear-gradient(160deg,#1971C2,#14568F)}
.hero .ic{font-size:46px}
.hero h1{font-size:26px; font-weight:800; margin-top:6px}
.hero p{font-size:15px; opacity:.92; margin-top:4px}
.card{background:#fff; border:1px solid var(--line); border-radius:16px; padding:20px 18px; margin-top:16px}
label{display:block; font-size:14.5px; color:var(--sub); font-weight:600; margin:14px 0 6px}
label:first-child{margin-top:0}
input{width:100%; padding:16px; border:1px solid var(--line); border-radius:12px;
  font-size:19px; font-family:inherit; background:#fff; color:var(--ink)}
input:focus{outline:none; border-color:var(--brand)}
.btn{display:block; width:100%; padding:18px; border:none; border-radius:13px; color:#fff;
  font-size:19px; font-weight:800; font-family:inherit; cursor:pointer; margin-top:18px; background:var(--brand)}
.btn.in{background:var(--green)} .btn.out{background:var(--blue)}
.btn:disabled{opacity:.5}
.btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line); font-weight:600; font-size:16px; padding:14px}
.err{color:var(--red); font-size:15px; margin-top:12px; line-height:1.6; min-height:22px}
.note{background:#FFF9DB; border:1px solid #FFE066; border-radius:12px; padding:12px 14px;
  font-size:14px; line-height:1.7; margin-top:14px}
.done{text-align:center; padding:26px 0 10px}
.done .ic{font-size:60px}
.done h2{font-size:24px; font-weight:800; margin:10px 0 4px}
.done .big{font-size:34px; font-weight:900; letter-spacing:1px; margin-top:8px}
.done.in .big{color:var(--green)} .done.out .big{color:var(--blue)}
</style>
</head>
<body>

<div id="loading" style="padding:70px 20px; text-align:center; color:#868E96">불러오는 중...</div>

<div id="formView" class="hidden">
  <div class="hero" id="hero">
    <div class="ic" id="hIc">🌅</div>
    <h1 id="hTitle">출근</h1>
    <p id="hStore">순창담 본점</p>
  </div>
  <div class="wrap">
    <div class="card">
      <label>이름</label>
      <input id="fName" placeholder="홍길동" autocomplete="name" enterkeyhint="next">
      <label>연락처 뒤 4자리</label>
      <input id="fL4" type="tel" inputmode="numeric" maxlength="4" placeholder="0000" enterkeyhint="done">
      <button class="btn" id="btnGo" onclick="go()">확인</button>
      <div class="err" id="err"></div>
      <div class="note" id="gpsNote">
        <b>매장 안에서만 찍혀요.</b> 폰이 위치를 물어보면 «허용»을 눌러주세요.<br>
        찍은 시각과 위치가 그대로 기록됩니다.
      </div>
    </div>
  </div>
</div>

<div id="doneView" class="hidden wrap">
  <div class="card" style="margin-top:26px">
    <div class="done" id="done">
      <div class="ic" id="dIc">✅</div>
      <h2 id="dMsg">출근 완료</h2>
      <div class="sub" id="dName"></div>
      <div class="big" id="dTime">--:--</div>
      <div class="sub" id="dExtra" style="margin-top:8px"></div>
    </div>
    <button class="btn ghost" onclick="location.reload()">닫기</button>
  </div>
</div>

<script>
const SUPABASE_URL='https://zcjvriedzememkiltqfa.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjanZyaWVkemVtZW1raWx0cWZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMjg2MTIsImV4cCI6MjA5OTYwNDYxMn0.2nZh82xFUNORqcKObAHUnz8K5EjjL-Nym0T4YkDHxMk';
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search);
const CODE=Q.get('c')||'';
let INFO=null, SENDING=false;

async function api(fn,...args){
  const res=await fetch(SUPABASE_URL+'/rest/v1/rpc/store_api',{method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON},
    body:JSON.stringify({p_fn:fn,p_args:args})});
  const d=await res.json();
  if(!d||d.ok===false) throw new Error((d&&d.error)||'잠시 후 다시 시도해주세요.');
  return d.result;
}
function hhmm(iso){ const d=new Date(iso);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

(async function init(){
  if(!CODE){ $('loading').textContent='올바른 QR이 아니에요.'; return; }
  try{
    INFO=await api('attendInfo',CODE);
    const isIn = INFO.kind==='in';
    document.title = INFO.store + (isIn?' 출근':' 퇴근');
    $('hero').className='hero '+(isIn?'in':'out');
    $('hIc').textContent = isIn?'🌅':'🌙';
    $('hTitle').textContent = isIn?'출근':'퇴근';
    $('hStore').textContent = INFO.store;
    $('btnGo').className='btn '+(isIn?'in':'out');
    $('btnGo').textContent = isIn?'출근 찍기':'퇴근 찍기';
    if(!INFO.needGps) $('gpsNote').innerHTML='<b>찍은 시각이 그대로 기록됩니다.</b>';
    $('loading').classList.add('hidden'); $('formView').classList.remove('hidden');
    $('fName').focus();
  }catch(e){ $('loading').textContent=e.message; }
})();

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  if(e.target.id==='fName'){ e.preventDefault(); $('fL4').focus(); }
  else if(e.target.id==='fL4'){ e.preventDefault(); go(); }
});
$('fL4').addEventListener('input',e=>{ e.target.value=e.target.value.replace(/[^0-9]/g,'').slice(0,4); });

function getPos(){
  return new Promise(resolve=>{
    if(!INFO.needGps || !navigator.geolocation) return resolve([null,null]);
    navigator.geolocation.getCurrentPosition(
      p=>resolve([p.coords.latitude,p.coords.longitude]),
      ()=>resolve([null,null]),
      {enableHighAccuracy:true, timeout:8000, maximumAge:0});
  });
}
async function go(){
  if(SENDING) return;
  const name=$('fName').value.trim(), l4=$('fL4').value.replace(/[^0-9]/g,'');
  $('err').textContent='';
  if(name.length<2){ $('err').textContent='이름을 적어주세요.'; $('fName').focus(); return; }
  if(l4.length!==4){ $('err').textContent='연락처 뒤 4자리를 적어주세요.'; $('fL4').focus(); return; }
  SENDING=true; $('btnGo').disabled=true; $('btnGo').textContent='위치 확인 중...';
  try{
    const [lat,lng]=await getPos();
    $('btnGo').textContent='기록 중...';
    const r=await api('attendQr',CODE,name,l4,lat,lng);
    const isIn = r.kind==='in';
    $('done').className='done '+(isIn?'in':'out');
    $('dIc').textContent = isIn?'🌅':'🌙';
    $('dMsg').textContent = isIn?'출근 완료':'퇴근 완료';
    $('dName').textContent = r.name+'님';
    $('dTime').textContent = hhmm(r.at);
    $('dExtra').textContent = isIn
      ? (r.dist!=null ? '매장에서 '+r.dist+'m · 오늘도 화이팅!' : '오늘도 화이팅!')
      : ('오늘 '+Math.floor(r.mins/60)+'시간 '+(r.mins%60)+'분 근무 · 수고하셨습니다');
    $('formView').classList.add('hidden'); $('doneView').classList.remove('hidden');
  }catch(e){
    $('err').textContent=e.message;
  }finally{
    SENDING=false; $('btnGo').disabled=false;
    $('btnGo').textContent = INFO.kind==='in'?'출근 찍기':'퇴근 찍기';
  }
}
</script>
</body>
</html>
