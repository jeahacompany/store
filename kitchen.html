<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주방 — 셀프바 보충 요청</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{--brand:#F26522; --ink:#20242E; --side:#20242E; --line:#E9ECEF; --sub:#868E96; --green:#2F9E44; --red:#E03131;}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
body{font-family:Pretendard,-apple-system,sans-serif; background:#F8F9FA; color:var(--ink); font-size:17px}
.topbar{display:flex; align-items:center; gap:14px; padding:14px 20px; background:var(--side); color:#fff; position:sticky; top:0; z-index:10}
.topbar .store{font-size:20px; font-weight:700}
.topbar .clock{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; margin-left:auto}
.topbar a{color:#8A90A0; font-size:14px; cursor:pointer; text-decoration:none}
.wrap{padding:16px 20px 40px}
.card{background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px}
h2{font-size:19px; display:flex; align-items:center; gap:8px}
.sub{color:var(--sub); font-size:14px}
.btn{padding:12px 18px; border:none; border-radius:12px; background:var(--brand); color:#fff;
  font-size:17px; font-weight:700; font-family:inherit; cursor:pointer}
.btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line)}
.btn.green{background:var(--green)} .btn.red{background:var(--red)}
.btn.big{font-size:22px; padding:18px 26px}
.hidden{display:none}
.badge{display:inline-block; padding:3px 10px; border-radius:99px; background:#F1F3F5; font-size:14px; font-weight:600}
.badge.r{background:#FFE3E3; color:#C92A2A} .badge.g{background:#D3F9D8; color:#2B8A3E}
.badge.a{background:#FFF3BF; color:#E67700}
/* 요청 카드 */
.reqs{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px}
.req{background:#fff; border:2px solid var(--line); border-radius:16px; padding:18px}
.req.new{border-color:var(--brand); box-shadow:0 0 0 4px #FFE8D9; animation:pulse 1.6s infinite}
.req.cook{border-color:var(--green)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px #FFE8D9} 50%{box-shadow:0 0 0 10px #FFF0E6}}
.req .head{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.req .no{font-size:30px; font-weight:800; color:var(--brand)}
.req .wait{margin-left:auto; font-size:15px; color:var(--sub)}
.req .items{margin:10px 0}
.req .it{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--line); font-size:19px}
.req .it b{font-size:22px}
.req .acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.login{max-width:340px; margin:80px auto; background:#fff; padding:26px; border-radius:16px}
.login input{width:100%; padding:13px; border:1px solid var(--line); border-radius:10px; font-size:17px; margin-top:8px; font-family:inherit}
.empty{text-align:center; padding:60px 0; color:var(--sub)}
.empty .big{font-size:56px}
/* 소리를 못 들어도 눈에 띄게 — 화면 전체가 번쩍인다 */
#flashLayer{position:fixed; inset:0; background:var(--brand); z-index:9999; pointer-events:none; opacity:0}
@keyframes flashAnim{0%{opacity:0} 12%{opacity:.75} 30%{opacity:0} 45%{opacity:.75} 62%{opacity:0} 78%{opacity:.6} 100%{opacity:0}}
.soundoff{background:#FFF3BF; border:1px solid #FFE066; border-radius:12px; padding:14px; margin-bottom:14px;
  font-size:17px; font-weight:700; text-align:center; cursor:pointer}
</style>
</head>
<body>

<div id="loginView" class="login">
  <h2 style="margin-bottom:6px">주방 화면</h2>
  <div class="sub">셀프바 보충 요청을 받는 화면이에요.</div>
  <label class="sub" style="display:block; margin-top:14px">아이디</label>
  <input id="liUser" autocomplete="username">
  <label class="sub" style="display:block; margin-top:10px">비밀번호</label>
  <input id="liPw" type="password" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn" style="width:100%; margin-top:14px" onclick="doLogin()">로그인</button>
  <div id="liErr" style="color:var(--red); margin-top:8px; font-size:14px"></div>
</div>

<div id="flashLayer" class="hidden"></div>

<div id="mainView" class="hidden">
  <div class="topbar">
    <span class="store" id="hdStore">주방</span>
    <span class="badge a" id="hdPending">대기 0</span>
    <span class="clock" id="hdClock">--:--</span>
    <a onclick="loadReqs()">↻</a>
    <a onclick="toggleSound()" id="sndBtn">🔔 소리 켬</a>
    <a onclick="doLogout()">로그아웃</a>
  </div>
  <div class="wrap">
    <div id="soundHint" class="soundoff hidden" onclick="unlockAudio(); beep(2); this.classList.add('hidden')">
      🔔 화면을 한 번 눌러 <b>알람 소리를 켜주세요</b> (브라우저 보안 때문에 첫 터치가 필요해요)
    </div>
    <div id="reqList" class="reqs"></div>
    <div id="emptyBox" class="empty hidden">
      <div class="big">👨‍🍳</div>
      <div style="font-size:20px; font-weight:700; margin-top:8px">들어온 요청이 없어요</div>
      <div class="sub" style="margin-top:6px">셀프바에서 요청하면 여기에 바로 뜨고 소리가 울려요</div>
    </div>
    <div class="card" style="margin-top:20px">
      <h2>오늘 완료 <span class="sub" id="doneCnt"></span></h2>
      <div id="doneList" class="sub">-</div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://zcjvriedzememkiltqfa.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjanZyaWVkemVtZW1raWx0cWZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMjg2MTIsImV4cCI6MjA5OTYwNDYxMn0.2nZh82xFUNORqcKObAHUnz8K5EjjL-Nym0T4YkDHxMk';
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN = localStorage.getItem('store_kitchen_token') || '';
let SEEN = new Set(), SOUND = true, REQS = [], PENDING_NEW = [];
// 확인 안 한 요청이 남아 있으면 25초마다 다시 알린다
setInterval(() => { if(PENDING_NEW.length) alarm(PENDING_NEW.some(x => x.urgent)); }, 25000);

async function api(fn, ...args){
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/store_api', {
    method:'POST', headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON},
    body: JSON.stringify({ p_fn: fn, p_args: args })
  });
  const data = await res.json();
  if(!data || data.ok === false){
    const msg = (data && data.error) || '서버 오류';
    if(msg.includes('세션이 만료')){ localStorage.removeItem('store_kitchen_token'); TOKEN=''; show('loginView'); }
    throw new Error(msg);
  }
  return data.result;
}
function show(v){ ['loginView','mainView'].forEach(x => $(x).classList.toggle('hidden', x!==v)); }

async function doLogin(){
  $('liErr').textContent = '';
  try{
    const r = await api('login', $('liUser').value.trim(), $('liPw').value);
    TOKEN = r.token; localStorage.setItem('store_kitchen_token', TOKEN);
    start();
  }catch(e){ $('liErr').textContent = e.message; }
}
function doLogout(){ localStorage.removeItem('store_kitchen_token'); TOKEN=''; show('loginView'); }

/* ---------- 알람 ----------
   주방은 시끄럽다. 그래서 ①크고 길게 ②안 누르면 계속 반복 ③화면도 같이 번쩍
   브라우저는 사용자가 화면을 한 번 만지기 전엔 소리를 못 내서, 첫 터치에 잠금을 푼다. */
let AC = null, AUDIO_OK = false;
function unlockAudio(){
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    AUDIO_OK = true;
    const b = $('sndBtn'); if(b && SOUND) b.textContent = '🔔 소리 켬';
  }catch(e){}
}
['click','touchstart','keydown'].forEach(ev =>
  document.addEventListener(ev, unlockAudio, { once:false, passive:true }));

function beep(times, loud){
  if(!SOUND) return;
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const vol = loud ? 0.9 : 0.6;
    for(let i = 0; i < (times||3); i++){
      // 두 음을 겹쳐 울려야 소음 속에서 들린다
      [880, 1320].forEach(f => {
        const o = AC.createOscillator(), g = AC.createGain();
        o.connect(g); g.connect(AC.destination);
        o.frequency.value = f; o.type = 'square';
        const t = AC.currentTime + i * 0.45;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
        g.gain.setValueAtTime(vol, t + 0.25);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
        o.start(t); o.stop(t + 0.4);
      });
    }
  }catch(e){}
}
/* 화면 번쩍임 — 소리를 못 들어도 눈에 띄게 */
function flash(){
  const el = $('flashLayer'); if(!el) return;
  el.classList.remove('hidden'); el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = 'flashAnim 1.4s ease-out';
  setTimeout(() => el.classList.add('hidden'), 1400);
}
function alarm(urgent){ beep(urgent ? 5 : 3, urgent); flash(); if(navigator.vibrate) navigator.vibrate([300,120,300,120,300]); }

function toggleSound(){
  SOUND = !SOUND;
  $('sndBtn').textContent = SOUND ? '🔔 소리 켬' : '🔕 소리 끔';
  if(SOUND){ unlockAudio(); beep(1); }
}

/* 화면이 꺼지면 알람도 못 듣는다 — 태블릿 화면을 계속 켜둔다 */
let WAKE = null;
async function keepAwake(){
  try{
    if('wakeLock' in navigator){
      WAKE = await navigator.wakeLock.request('screen');
      document.addEventListener('visibilitychange', async () => {
        if(document.visibilityState === 'visible' && 'wakeLock' in navigator){
          try{ WAKE = await navigator.wakeLock.request('screen'); }catch(e){}
        }
      });
    }
  }catch(e){}
}

function tick(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  $('hdClock').textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
setInterval(tick, 1000); tick();

async function loadReqs(){
  try{
    const r = await api('barReqList', TOKEN);
    REQS = r.rows || [];
    const live = REQS.filter(x => x.status === '요청' || x.status === '조리중');
    const done = REQS.filter(x => x.status === '완료');
    $('hdPending').textContent = '대기 ' + live.length;
    $('hdPending').className = 'badge ' + (live.length ? 'r' : 'g');

    // 새 요청이 들어오면 소리 + 화면 번쩍
    const fresh = live.filter(x => x.status === '요청' && !SEEN.has(x.id));
    if(fresh.length){ alarm(fresh.some(f => f.urgent)); }
    live.forEach(x => SEEN.add(x.id));
    // 아직 아무도 안 누른 요청이 남아 있으면 계속 다시 울린다 (놓치면 안 되니까)
    PENDING_NEW = live.filter(x => x.status === '요청');
    if(!AUDIO_OK && PENDING_NEW.length) $('soundHint').classList.remove('hidden');

    $('emptyBox').classList.toggle('hidden', live.length > 0);
    $('reqList').innerHTML = live.map(x =>
      '<div class="req '+(x.status==='요청'?'new':'cook')+'">'
      + '<div class="head"><span class="no">'+x.req_no+'</span>'
        + (x.urgent ? '<span class="badge r">급함</span>' : '')
        + (x.status==='조리중' ? '<span class="badge g">조리중 '+(x.eta_min||'')+'분</span>' : '<span class="badge a">새 요청</span>')
        + '<span class="wait">'+x.wait_min+'분 전</span></div>'
      + '<div class="items">' + (x.items||[]).map(i =>
          '<div class="it"><span>'+esc(i.name)+'</span><b>'+(+i.qty)+esc(i.unit||'')+'</b></div>').join('') + '</div>'
      + (x.memo ? '<div class="sub">'+esc(x.memo)+'</div>' : '')
      + '<div class="sub">요청: '+esc(x.requested_by||'')+'</div>'
      + '<div class="acts">'
        + (x.status==='요청'
            ? '<button class="btn" onclick="accept(\''+x.id+'\',5)">5분</button>'
              + '<button class="btn" onclick="accept(\''+x.id+'\',10)">10분</button>'
              + '<button class="btn" onclick="accept(\''+x.id+'\',15)">15분</button>'
              + '<button class="btn green" onclick="done(\''+x.id+'\')">바로 완료</button>'
            : '<button class="btn green big" onclick="done(\''+x.id+'\')">✔ 완료</button>')
      + '</div></div>'
    ).join('');

    $('doneCnt').textContent = done.length + '건';
    $('doneList').innerHTML = done.slice(0,10).map(x =>
      '<div style="padding:6px 0; border-bottom:1px solid var(--line)">'
      + '<b>'+x.req_no+'번</b> · ' + (x.items||[]).map(i => esc(i.name)+' '+(+i.qty)+esc(i.unit||'')).join(', ')
      + ' <span class="sub">('+(x.done_at ? new Date(x.done_at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}) : '')+')</span></div>'
    ).join('') || '<div class="sub">아직 없어요</div>';
  }catch(e){ /* 잠시 실패해도 다음 갱신 때 다시 */ }
}
async function accept(id, min){
  try{ await api('barReqAccept', TOKEN, id, min); loadReqs(); }catch(e){ alert(e.message); }
}
async function done(id){
  try{
    const r = await api('barReqDone', TOKEN, id);
    loadReqs();
  }catch(e){ alert(e.message); }
}

async function start(){
  show('mainView');
  keepAwake();                       // 태블릿 화면이 꺼지지 않게
  if(!AUDIO_OK) $('soundHint').classList.remove('hidden');
  try{ const b = await api('boot', TOKEN); $('hdStore').textContent = (b.store && b.store.name ? b.store.name : '주방') + ' 주방'; }catch(e){}
  loadReqs();
  setInterval(loadReqs, 5000);   // 5초마다 — 주방은 빨라야 한다
}
if(TOKEN) start(); else show('loginView');
</script>
</body>
</html>
