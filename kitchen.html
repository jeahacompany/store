<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 새 버전을 바로 받도록 캐시 금지 (배포 후 강력새로고침 없이 반영) -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주방 — 셀프바 보충 요청</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
:root{--brand:#F26522; --ink:#20242E; --side:#20242E; --line:#E9ECEF; --sub:#868E96; --green:#2F9E44; --red:#E03131;}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent}
body{font-family:Pretendard,-apple-system,sans-serif; background:#F8F9FA; color:var(--ink); font-size:17px}
.topbar{display:flex; align-items:center; gap:14px; padding:14px 20px; background:var(--side); color:#fff; position:sticky; top:0; z-index:10}
.topbar .store{font-size:20px; font-weight:700}
.topbar .hddate{margin-left:auto; font-size:16px; color:#AEB4C0}
.topbar .clock{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums}
.topbar a{color:#8A90A0; font-size:14px; cursor:pointer; text-decoration:none}
.wrap{padding:16px 20px 40px}
.card{background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px}
h2{font-size:19px; display:flex; align-items:center; gap:8px}
.sub{color:var(--sub); font-size:14px}
.btn{padding:12px 18px; border:none; border-radius:12px; background:var(--brand); color:#fff;
  font-size:17px; font-weight:700; font-family:inherit; cursor:pointer}
.btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line)}
.btn.green{background:var(--green)} .btn.red{background:var(--red)}
.btn.big{font-size:22px; padding:18px 26px}
.hidden{display:none}
.badge{display:inline-block; padding:3px 10px; border-radius:99px; background:#F1F3F5; font-size:14px; font-weight:600}
.badge.r{background:#FFE3E3; color:#C92A2A} .badge.g{background:#D3F9D8; color:#2B8A3E}
.badge.a{background:#FFF3BF; color:#E67700}
/* 요청 카드 */
.reqs{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px}
.req{background:#fff; border:2px solid var(--line); border-radius:16px; padding:18px}
.req.new{border-color:var(--brand); box-shadow:0 0 0 4px #FFE8D9; animation:pulse 1.6s infinite}
.req.cook{border-color:var(--green)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px #FFE8D9} 50%{box-shadow:0 0 0 10px #FFF0E6}}
.req .head{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.req .no{font-size:30px; font-weight:800; color:var(--brand)}
.req .wait{margin-left:auto; font-size:15px; color:var(--sub)}
.req .items{margin:10px 0}
/* 카드 하나 = 만들 것 하나. 품목명을 크게 보여준다 */
.req .it{display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:6px 0}
.req .it .what{font-size:26px; font-weight:800; line-height:1.25}
.req .it b{font-size:26px; white-space:nowrap}
.req .it.done{opacity:.45}
.req .it.done .what{text-decoration:line-through}
.req .okmark{color:var(--green); font-weight:700; font-size:20px}
.btn.sm{padding:8px 16px; font-size:16px}
.req .acts{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px}
.ktabs{display:flex; gap:0; background:#fff; border-radius:14px; overflow:hidden; margin-bottom:16px; border:1px solid var(--line)}
.ktabs .kt{flex:1; padding:16px 8px; font-size:19px; font-weight:700; background:none; border:none;
  color:#868E96; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; position:relative}
.ktabs .kt.active{color:#fff; background:var(--brand)}
.ktabs .kt .n{background:#E9ECEF; color:#495057; border-radius:20px; padding:2px 11px; font-size:16px}
.ktabs .kt.active .n{background:rgba(255,255,255,.25); color:#fff}
.ktabs .kt.alert{animation:ktblink .8s infinite}
@keyframes ktblink{0%,100%{background:#FFF0E6}50%{background:#FFD8BF}}
.drow{display:flex; align-items:center; gap:10px; padding:11px 2px; border-bottom:1px solid var(--line); font-size:16px}
.drow .dno{font-weight:800; min-width:44px}
.drow .dwhat{flex:1}
.drow .dt{color:#868E96; font-size:14px; white-space:nowrap}
.serve-wait{background:#FFF9DB; border:2px solid #FFE066; border-radius:14px; padding:14px 16px;
  font-size:18px; margin-bottom:14px}
.btn.full{width:100%; margin-top:8px}
.login{max-width:340px; margin:80px auto; background:#fff; padding:26px; border-radius:16px}
.login input{width:100%; padding:13px; border:1px solid var(--line); border-radius:10px; font-size:17px; margin-top:8px; font-family:inherit}
.empty{text-align:center; padding:60px 0; color:var(--sub)}
.empty .big{font-size:56px}
/* 소리를 못 들어도 눈에 띄게 — 화면 전체가 번쩍인다 */
#flashLayer{position:fixed; inset:0; background:var(--brand); z-index:9999; pointer-events:none; opacity:0}
@keyframes flashAnim{0%{opacity:0} 12%{opacity:.75} 30%{opacity:0} 45%{opacity:.75} 62%{opacity:0} 78%{opacity:.6} 100%{opacity:0}}
.soundoff{background:#FFF3BF; border:1px solid #FFE066; border-radius:12px; padding:14px; margin-bottom:14px;
  font-size:17px; font-weight:700; text-align:center; cursor:pointer}
</style>
</head>
<body>

<div id="loginView" class="login">
  <h2 style="margin-bottom:6px">주방 화면</h2>
  <div class="sub">셀프바 보충 요청을 받는 화면이에요.</div>
  <label class="sub" style="display:block; margin-top:14px">아이디</label>
  <input id="liUser" autocomplete="username">
  <label class="sub" style="display:block; margin-top:10px">비밀번호</label>
  <input id="liPw" type="password" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn" style="width:100%; margin-top:14px" onclick="doLogin()">로그인</button>
  <div id="liErr" style="color:var(--red); margin-top:8px; font-size:14px"></div>
</div>

<div id="flashLayer" class="hidden"></div>

<div id="mainView" class="hidden">
  <div class="topbar">
    <span class="store" id="hdStore">주방</span>
    <span class="badge a" id="hdPending">대기 0</span>
    <span class="hddate" id="hdDate"></span>
    <span class="clock" id="hdClock">--:--</span>
    <a onclick="loadReqs()">↻</a>
    <a onclick="toggleSound()" id="sndBtn">🔔 소리 켬</a>
    <a onclick="doLogout()">로그아웃</a>
  </div>
  <div class="wrap">
    <div id="soundHint" class="soundoff hidden" onclick="unlockAudio(); beep(2); this.classList.add('hidden')">
      🔔 화면을 한 번 눌러 <b>알람 소리를 켜주세요</b> (브라우저 보안 때문에 첫 터치가 필요해요)
    </div>
    <div class="ktabs">
      <button class="kt active" id="ktNew" onclick="ktab('new')">🔥 신규 주문 <span class="n" id="cntNew">0</span></button>
      <button class="kt" id="ktDone" onclick="ktab('done')">✔ 오늘 완료 <span class="n" id="cntDone">0</span></button>
    </div>

    <div id="pane-new">
      <div id="serveWait" class="serve-wait hidden"></div>
      <div id="reqList" class="reqs"></div>
      <div id="emptyBox" class="empty hidden">
        <div class="big">👨‍🍳</div>
        <div style="font-size:20px; font-weight:700; margin-top:8px">들어온 요청이 없어요</div>
        <div class="sub" style="margin-top:6px">셀프바에서 요청하면 여기에 바로 뜨고 소리가 울려요</div>
      </div>
    </div>

    <div id="pane-done" class="hidden">
      <div class="card">
        <h2>⏱ 오늘 약속 지킨 기록 <span class="sub">— 몇 분이라고 했고, 실제로 몇 분 걸렸나</span></h2>
        <div id="tSum" style="display:flex; gap:20px; flex-wrap:wrap; font-size:15px"></div>
      </div>
      <div class="card">
        <h2>✔ 오늘 완료 <span class="sub" id="doneCnt"></span></h2>
        <div id="doneList"></div>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://zcjvriedzememkiltqfa.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpjanZyaWVkemVtZW1raWx0cWZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwMjg2MTIsImV4cCI6MjA5OTYwNDYxMn0.2nZh82xFUNORqcKObAHUnz8K5EjjL-Nym0T4YkDHxMk';
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN = localStorage.getItem('store_kitchen_token') || '';
let SEEN = new Set(), REQS = [], PENDING_NEW = [];
let SOUND = localStorage.getItem('store_kitchen_sound') !== '0';   // 끈 상태는 새로고침해도 유지

async function api(fn, ...args){
  const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/store_api', {
    method:'POST', headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON,'Authorization':'Bearer '+SUPABASE_ANON},
    body: JSON.stringify({ p_fn: fn, p_args: args })
  });
  const data = await res.json();
  if(!data || data.ok === false){
    const msg = (data && data.error) || '서버 오류';
    if(msg.includes('세션이 만료')){ localStorage.removeItem('store_kitchen_token'); TOKEN=''; show('loginView'); }
    throw new Error(msg);
  }
  return data.result;
}
function show(v){ ['loginView','mainView'].forEach(x => $(x).classList.toggle('hidden', x!==v)); }

async function doLogin(){
  $('liErr').textContent = '';
  try{
    const r = await api('login', $('liUser').value.trim(), $('liPw').value);
    TOKEN = r.token; localStorage.setItem('store_kitchen_token', TOKEN);
    start();
  }catch(e){ $('liErr').textContent = e.message; }
}
function doLogout(){ localStorage.removeItem('store_kitchen_token'); TOKEN=''; show('loginView'); }

/* ---------- 알람 ----------
   주방은 시끄럽다. 그래서 ①크고 길게 ②안 누르면 계속 반복 ③화면도 같이 번쩍
   브라우저는 사용자가 화면을 한 번 만지기 전엔 소리를 못 내서, 첫 터치에 잠금을 푼다. */
let AC = null, AUDIO_OK = false;
function unlockAudio(){
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    AUDIO_OK = true;
    const b = $('sndBtn'); if(b && SOUND) b.textContent = '🔔 소리 켬';
  }catch(e){}
}
['click','touchstart','keydown'].forEach(ev =>
  document.addEventListener(ev, unlockAudio, { once:false, passive:true }));

/* 맑은 종소리 한 번 — 하루 종일 들어도 안 거슬리게
   삐빅 하는 사각파 대신, 사인파를 길게 울려서 여운이 남는 차임 소리 */
function beep(){
  if(!SOUND) return;
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime;
    // 딩- 동- 두 음 (E6 → A6), 각각 배음을 살짝 얹어 종처럼
    [[1318.5, 0], [1760.0, 0.13]].forEach(([f, delay]) => {
      [[f, 0.28], [f * 2, 0.07]].forEach(([freq, vol]) => {
        const o = AC.createOscillator(), g = AC.createGain();
        o.connect(g); g.connect(AC.destination);
        o.frequency.value = freq; o.type = 'sine';
        const t = t0 + delay;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.015);   // 빠르게 올라갔다
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);  // 길게 사라진다
        o.start(t); o.stop(t + 1.15);
      });
    });
  }catch(e){}
}
/* 화면 번쩍임 — 소리를 못 들어도 눈에 띄게 */
function flash(){
  const el = $('flashLayer'); if(!el) return;
  el.classList.remove('hidden'); el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = 'flashAnim 1.4s ease-out';
  setTimeout(() => el.classList.add('hidden'), 1400);
}
/* 새 요청 알림 — 소리는 딱 한 번. 못 들어도 화면이 번쩍이고 카드가 계속 깜빡인다 */
function alarm(){ beep(); flash(); if(SOUND && navigator.vibrate) navigator.vibrate(200); }

function toggleSound(){
  SOUND = !SOUND;
  localStorage.setItem('store_kitchen_sound', SOUND ? '1' : '0');   // 새로고침해도 유지
  $('sndBtn').textContent = SOUND ? '🔔 소리 켬' : '🔕 소리 끔';
  if(SOUND){ unlockAudio(); beep(); }
}

/* 화면이 꺼지면 알람도 못 듣는다 — 태블릿 화면을 계속 켜둔다 */
let WAKE = null;
async function keepAwake(){
  try{
    if('wakeLock' in navigator){
      WAKE = await navigator.wakeLock.request('screen');
      document.addEventListener('visibilitychange', async () => {
        if(document.visibilityState === 'visible' && 'wakeLock' in navigator){
          try{ WAKE = await navigator.wakeLock.request('screen'); }catch(e){}
        }
      });
    }
  }catch(e){}
}

const DOWK = ['일','월','화','수','목','금','토'];
function tick(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  $('hdDate').textContent = d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOWK[d.getDay()]+')';
  $('hdClock').textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
setInterval(tick, 1000); tick();

let KTAB = 'new';
function ktab(name){
  KTAB = name;
  $('pane-new').classList.toggle('hidden', name !== 'new');
  $('pane-done').classList.toggle('hidden', name !== 'done');
  $('ktNew').classList.toggle('active', name === 'new');
  $('ktDone').classList.toggle('active', name === 'done');
  if(name === 'new') $('ktNew').classList.remove('alert');
}

// 약속 시간 대비 지금 상태 — 남았으면 초록, 넘겼으면 빨강
function etaBadge(x){
  if(!x.eta_min) return '<span class="badge g">조리중</span>';
  const over = (x.over_min != null) ? +x.over_min : null;
  if(over === null) return '<span class="badge g">조리중 '+x.eta_min+'분</span>';
  if(over <= 0) return '<span class="badge g">'+x.eta_min+'분 약속 · '+Math.max(0,Math.ceil(-over))+'분 남음</span>';
  return '<span class="badge r">'+x.eta_min+'분 약속 · '+Math.ceil(over)+'분 초과</span>';
}

async function loadReqs(){
  try{
    const r = await api('barReqList', TOKEN);
    REQS = r.rows || [];
    const live = REQS.filter(x => x.status === '요청' || x.status === '조리중');
    const done = REQS.filter(x => x.status === '나옴' || x.status === '완료');
    const waitServe = REQS.filter(x => x.status === '나옴');   // 나왔는데 홀이 아직 안 가져감
    $('serveWait').classList.toggle('hidden', !waitServe.length);
    $('serveWait').innerHTML = waitServe.length
      ? '🍽 <b>' + waitServe.map(x => x.req_no+'번').join(', ') + '</b> 나왔는데 아직 안 가져갔어요'
        + (waitServe.some(x => x.serve_min >= 3) ? ' <span class="badge r">3분 넘음 — 홀에 알려주세요</span>' : '')
      : '';
    $('hdPending').textContent = '대기 ' + live.length;
    $('hdPending').className = 'badge ' + (live.length ? 'r' : 'g');

    $('cntNew').textContent = live.length;
    $('cntDone').textContent = done.length;

    // 새 요청이 들어오면 소리 한 번 + 화면 한 번 번쩍 (여러 개가 한꺼번에 와도 한 번만)
    const fresh = live.filter(x => x.status === '요청' && !SEEN.has(x.id));
    if(fresh.length){
      alarm();
      if(KTAB !== 'new') ktab('new');     // 완료탭 보고 있어도 신규로 바로 넘어감
    }
    live.forEach(x => SEEN.add(x.id));
    $('ktNew').classList.toggle('alert', KTAB !== 'new' && live.some(x => x.status === '요청'));
    PENDING_NEW = live.filter(x => x.status === '요청');
    if(!AUDIO_OK && SOUND && PENDING_NEW.length) $('soundHint').classList.remove('hidden');

    $('emptyBox').classList.toggle('hidden', live.length > 0);
    $('reqList').innerHTML = live.map(x =>
      '<div class="req '+(x.status==='요청'?'new':'cook')+'">'
      + '<div class="head"><span class="no">'+x.req_no+'</span>'
        + (x.urgent ? '<span class="badge r">급함</span>' : '')
        + (x.status==='조리중' ? etaBadge(x) : '<span class="badge a">새 요청</span>')
        + '<span class="wait">'+x.wait_min+'분 전</span></div>'
      + '<div class="items">' + (x.items||[]).map(i => {
          const ok = i.status === '완료';
          return '<div class="it'+(ok?' done':'')+'">'
            + '<span class="what">'+esc(i.name)+'</span><b>'+(+i.qty)+esc(i.unit||'')+'</b>'
            + (ok ? ' <span class="okmark">✔</span>' : '')
            + '</div>';
        }).join('') + '</div>'
      + (x.memo ? '<div class="sub">'+esc(x.memo)+'</div>' : '')
      + '<div class="sub">오늘 '+x.req_no+'번째 요청 · '+esc(x.requested_by||'')+'</div>'
      + (x.status==='요청'
          ? '<div class="acts">'
              + '<button class="btn" onclick="accept(\''+x.id+'\',3)">3분</button>'
              + '<button class="btn" onclick="accept(\''+x.id+'\',5)">5분</button>'
              + '<button class="btn" onclick="accept(\''+x.id+'\',10)">10분</button>'
            + '</div>'
            + '<button class="btn green big full" onclick="done(\''+x.id+'\')">✔ 바로 완료</button>'
          : '<button class="btn green big full" onclick="done(\''+x.id+'\')">✔ 완료</button>')
      + '</div>'
    ).join('');

    // 완료 목록 — 하나하나, 약속 대비 결과까지
    $('doneCnt').textContent = done.length + '건';
    $('doneList').innerHTML = done.map(x => {
      let verdict;
      if(x.eta_min == null) verdict = '<span class="badge">즉시</span>';
      else if(x.over_min == null) verdict = '';
      else if(+x.over_min <= 0) verdict = '<span class="badge g">'+x.eta_min+'분 → '+x.cook_min+'분 · 지킴</span>';
      else verdict = '<span class="badge r">'+x.eta_min+'분 → '+x.cook_min+'분 · '+(+x.over_min).toFixed(1)+'분 초과</span>';
      const served = x.status === '완료'
        ? '<span class="badge g">홀 서빙 '+(x.served_hm||'')+'</span>'
        : '<span class="badge a">홀 대기'+(x.serve_min>=1 ? ' '+Math.round(x.serve_min)+'분' : '')+'</span>';
      return '<div class="drow"'+(x.status==='나옴'?' style="background:#FFF9DB"':'')+'>'
        + '<span class="dno">'+x.req_no+'번</span>'
        + '<span class="dwhat">' + (x.items||[]).map(i => esc(i.name)+' '+(+i.qty)+esc(i.unit||'')).join(', ')
        + ' ' + verdict + ' ' + served + '</span>'
        + '<span class="dt">'+(x.done_hm||'')+' · '+esc(x.accepted_by||'')+'</span></div>';
    }).join('') || '<div class="sub">아직 없어요</div>';

    // 오늘 누적 성적
    const prom = done.filter(x => x.over_min != null);
    const kept = prom.filter(x => +x.over_min <= 0);
    const avgOver = prom.length ? (prom.reduce((a,x)=>a+ +x.over_min,0)/prom.length) : null;
    const avgReal = done.filter(x=>x.cook_min!=null).length
      ? done.filter(x=>x.cook_min!=null).reduce((a,x)=>a+ +x.cook_min,0)/done.filter(x=>x.cook_min!=null).length : null;
    $('tSum').innerHTML =
      '<div><div class="sub">완료</div><b style="font-size:22px">'+done.length+'건</b></div>'
      + '<div><div class="sub">약속 지킴</div><b style="font-size:22px">'
        + (prom.length ? Math.round(100*kept.length/prom.length)+'%' : '-')
        + '</b> <span class="sub">('+kept.length+'/'+prom.length+')</span></div>'
      + '<div><div class="sub">평균 소요</div><b style="font-size:22px">'+(avgReal!=null?avgReal.toFixed(1)+'분':'-')+'</b></div>'
      + '<div><div class="sub">평균 차이</div><b style="font-size:22px; color:'+((avgOver>0)?'#E03131':'#2B8A3E')+'">'
        + (avgOver!=null ? (avgOver>0?'+':'')+avgOver.toFixed(1)+'분' : '-') + '</b></div>';
  }catch(e){ /* 잠시 실패해도 다음 갱신 때 다시 */ }
}
async function accept(id, min){
  try{ await api('barReqAccept', TOKEN, id, min); loadReqs(); }catch(e){ alert(e.message); }
}
async function itemDone(itemId){
  try{
    const r = await api('barItemDone', TOKEN, itemId);
    if(r.left === 0) beep(1);           // 이 요청이 다 끝났다는 신호
    loadReqs();
  }catch(e){ alert(e.message); }
}
async function done(id){
  try{
    await api('barReqDone', TOKEN, id);
    loadReqs();
  }catch(e){ alert(e.message); }
}

async function start(){
  show('mainView');
  keepAwake();                       // 태블릿 화면이 꺼지지 않게
  if(!AUDIO_OK) $('soundHint').classList.remove('hidden');
  try{ const b = await api('boot', TOKEN); $('hdStore').textContent = (b.store && b.store.name ? b.store.name : '주방') + ' 주방'; }catch(e){}
  loadReqs();
  setInterval(loadReqs, 5000);   // 5초마다 — 주방은 빨라야 한다
}
if(TOKEN) start(); else show('loginView');
</script>
